[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
colored = "3.1.1"
dotenvy = "0.15.7"
hyper = { version = "1.12.0", features = ["full"] }
serde = "1.0.229"
serde_json = "1.0.154"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
tokio = { version = "1.54.1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
subtle = "2.6.1"
tower-http = { version = "0.7.1", features = ["cors"] }
hex = "0.4.3"
sha2 = "0.11.1"
rand = "0.10.3"
